<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> MonitoredServer - Admin Panel </title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <h2> Admin Panel </h2>

        <div class="dashboard-links">
            <a href="index.html"> Home </a>
        </div>
    </header>

    <main class="dashboard-content">
        <h1> Admin Dashboard </h1>
        <p class="dashboard-subtitle"> Manage users, groups & projects </p>

        <p id="admin-message"></p>
        
         <!-- User Management -->
         <section class="dashboard-card">
            <h2> User Management </h2>
            <div id="users-container"></div>
         </section>

         <!-- Group Management -->
         <section class="dashboard-card">
            <h2> Group Management </h2>

            <form id="create-group-form">
                <h3> Create New Group </h3>

                <label for="group-name"> Group Name </label>
                <input type="text" id="group-name" required>

                <label for="group-description"> Description </label>
                <input type="text" id="group-description" required>

                <label for="manager-id"> Manager User Id </label>
                <input type="number" id="manager-id" required>

                <button type="submit"> Craete Group </button>

            </form>

            <div id="groups-container"></div>
         </section>

         <!-- Project Management -->
          <section class="dashboard-card">
            <h2> Project Management </h2>

            <form id="create-project-form">
                <h3> Create New Project </h3>

                <label for="project-name"> Project Name </label>
                <input type="text" id="project-name" required>

                <label for="project-description"> Description </label>
                <input type="text" id="project-description" required>

                <button type="submit"> Craete Project </button>

            </form>

            <div id="projects-container"></div>
          </section>

    </main>
    
    <script src="admin.js"></script>
</body>
</html>
